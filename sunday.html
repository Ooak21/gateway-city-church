<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunday · We're glad you're here</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  /* Projector mode. Dark is deliberate in the sanctuary; phones land on the light app. */
  body{background:#121820;color:#F6F2EA}
  .sanctuary{min-height:100vh;display:grid;place-items:center;padding:40px 20px;text-align:center}
  .sanctuary h1{font-size:clamp(48px,8vw,96px);color:#fff}
  .sanctuary h1 em{font-style:italic;color:var(--gold-soft)}
  .qr-frame{margin:30px auto;padding:18px;background:#fff;border-radius:28px;width:min(360px,72vw);box-shadow:0 30px 80px rgba(0,0,0,.35)}
  .qr-frame img{width:100%;height:auto;border-radius:16px}
  .count{font-family:var(--display);font-size:72px;color:var(--gold-soft);margin:6px 0 0}
  .sub{color:rgba(246,242,234,.55);font-size:14px}
  .svc{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-soft);font-weight:700}
</style>
</head>
<body>
<main class="sanctuary">
  <div>
    <div class="svc" id="svcLabel">Welcome to GateWay City Church</div>
    <h1>If you are in the room,<br>let us know you're <em>here</em>.</h1>
    <div class="qr-frame"><img id="qrImg" alt="Scan to check in"></div>
    <p class="sub">Scan with your phone camera. First time? Twenty seconds. Family already? One tap.</p>
    <div class="count" id="hereCount">0</div>
    <p class="sub">checked in today</p>
  </div>
</main>
<script src="gcc-config.js"></script>
<script src="gcc-data.js"></script>
<script>
(function () {
  const C = window.GCC, D = window.GCCData;
  const target = C.APP_URL + '?src=qr';
  document.getElementById('qrImg').src =
    'https://api.qrserver.com/v1/create-qr-code/?size=480x480&margin=12&data=' + encodeURIComponent(target);
  const now = new Date();
  const svc = C.SERVICES.find(s => s.day === now.toLocaleDateString('en-US', { weekday: 'long' }));
  if (svc) document.getElementById('svcLabel').textContent = svc.label + ' · ' + svc.time;
  async function tick() {
    try { document.getElementById('hereCount').textContent = await D.todayCheckinCount(); }
    catch (e) { console.error(e); }
  }
  tick();
  setInterval(tick, 8000);
})();
</script>
</body>
</html>
